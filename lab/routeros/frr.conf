frr defaults traditional
hostname shield-lab
log stdout informational
!
! Stand-in for Shield's FRR: announces like Shield does (community 154950:666, no-export,
! discard next hop 192.0.2.1), plus routes the router filter must reject.
ip route 163.5.191.250/32 Null0
ip route 163.5.191.0/24 Null0
ip route 77.107.95.9/32 Null0
ip route 8.8.8.8/32 Null0
!
ip prefix-list BH seq 5 permit 163.5.191.250/32
ip prefix-list BH seq 10 permit 163.5.191.0/24
ip prefix-list BH seq 15 permit 8.8.8.8/32
!
route-map SHIELD-OUT permit 10
 match ip address prefix-list BH
 set community 154950:666 no-export
 set ip next-hop 192.0.2.1
exit
route-map SHIELD-OUT permit 20
exit
!
router bgp 154950
 bgp router-id 10.0.2.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 127.0.0.40 remote-as 154950
 neighbor 127.0.0.40 port 1179
 neighbor 127.0.0.40 timers connect 5
 address-family ipv4 unicast
  network 163.5.191.250/32
  network 163.5.191.0/24
  network 77.107.95.9/32
  network 8.8.8.8/32
  neighbor 127.0.0.40 route-map SHIELD-OUT out
 exit-address-family
exit
