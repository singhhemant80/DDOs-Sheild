# /etc/nginx/sites-available/crapplet-shield.conf
# Listens ONLY on the management-VLAN address. Replace 10.255.0.10 and the allow-list.

limit_req_zone $binary_remote_addr zone=shield_api:10m rate=30r/s;

server {
    listen 10.255.0.10:443 ssl;
    http2 on;
    server_name shield.mgmt.example.net;

    ssl_certificate     /etc/crapplet-shield/tls/shield.crt;
    ssl_certificate_key /etc/crapplet-shield/tls/shield.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Management networks / VPN only.
    allow 10.255.0.0/24;
    allow 10.254.0.0/24;
    deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    client_max_body_size 1m;

    location /api/ {
        limit_req zone=shield_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;      # WebSockets (Phase 3)
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 75s;
    }

    # Dashboard static build (Phase 3)
    location / {
        root /opt/crapplet-shield/frontend/dist;
        try_files $uri /index.html;
    }
}
