# Builds the deployable bundles the one-command installer downloads.
#
# To release: change the VERSION file on main (e.g. v0.4.0) and push. This workflow then creates
# the tag and the GitHub release, and uploads crapplet-shield-<tag>-linux-{amd64,arm64}.tar.gz
# plus .sha256 files. Pushing a v* tag directly works too.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="$(tr -d '[:space:]' < VERSION)"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad version '$tag'"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Test collector
        run: cd collector && go vet ./... && go test ./...

      - name: Build dashboard (architecture independent)
        run: cd frontend && npm ci && npm run build

      - name: Build bundles
        env: { TAG: "${{ steps.v.outputs.tag }}" }
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            rm -rf stage && mkdir stage
            git archive --format=tar HEAD | tar -x -C stage
            (cd collector && CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o ../stage/collector/bin/ ./cmd/...)
            cp -r frontend/dist stage/frontend/dist
            echo "$TAG" > stage/VERSION
            name="crapplet-shield-${TAG}-linux-${arch}.tar.gz"
            tar -C stage -czf "dist/$name" .
            (cd dist && sha256sum "$name" > "$name.sha256")
          done
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
