name: routeros-lab
on:
  push:
    branches: [lab/routeros-chr]
jobs:
  chr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 frr jq unzip
      - run: OUT=$PWD/out bash lab/routeros/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: routeros-lab, path: out }
