name: routeros-lab
on:
  push:
    branches: [lab/routeros-chr]
permissions:
  contents: write
jobs:
  chr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 frr jq unzip
      - run: OUT=$PWD/out bash lab/routeros/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: routeros-lab, path: out }
      - if: always()
        name: Publish results to a branch (artifacts are not readable from every client)
        run: |
          cd out
          git init -q -b lab/routeros-chr-out && git add -A
          git -c user.name=routeros-lab -c user.email=routeros-lab@users.noreply.github.com commit -q -m "RouterOS lab results ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:lab/routeros-chr-out
