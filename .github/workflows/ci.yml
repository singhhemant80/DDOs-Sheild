name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  collector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: cd collector && test -z "$(gofmt -l .)" && go vet ./... && go test ./...

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run build

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: shield_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd backend && pip install -e ".[dev]"
      - run: cd backend && python -m pytest -q
        env:
          SHIELD_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1/shield_test
          SHIELD_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      # Phase 7 staging tests: Shield's FRR speaker against FRR lab routers (needs root for bgpd).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq frr
      - run: cd backend && sudo -E env "PATH=$PATH" python -m pytest -q tests/test_frr_staging.py -rs
        env:
          SHIELD_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1/shield_test
          SHIELD_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          SHIELD_REQUIRE_FRR: "1"

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh deploy/scripts/*.sh
